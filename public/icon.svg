<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1db954"/>
      <stop offset="100%" style="stop-color:#0a7e3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#1db954"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Music wave bars -->
  <rect x="100" y="280" width="32" height="100" rx="16" fill="white" opacity="0.3"/>
  <rect x="148" y="240" width="32" height="140" rx="16" fill="white" opacity="0.4"/>
  <rect x="196" y="200" width="32" height="180" rx="16" fill="white" opacity="0.3"/>
  <!-- Play triangle -->
  <path d="M300 200 L420 280 L300 360 Z" fill="white" opacity="0.95"/>
  <!-- AMAX text -->
  <text x="256" y="450" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="72" fill="white" letter-spacing="8">AMAX</text>
</svg>
